{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto my-8 bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
  <div class="text-center mb-6">
    <div class="text-4xl mb-2">🍽️</div>
    <h2 class="text-2xl font-extrabold text-slate-800">จองโต๊ะอาหารล่วงหน้า</h2>
    <p class="text-xs text-slate-500 mt-1">กรอกข้อมูลการจอง ระบบจะทำการค้นหาและจัดโต๊ะว่างให้อัตโนมัติ</p>
  </div>

  <form action="/customer_reserve" method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">👤 ชื่อผู้จอง</label>
      <input type="text" name="customer_name" value="{{ session.get('user', {}).get('username', '') }}" placeholder="กรอกชื่อ-นามสกุล" required class="w-full p-3 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">📞 เบอร์โทรศัพท์</label>
      <input type="tel" name="phone" placeholder="เช่น 0812345678" required class="w-full p-3 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">👥 จำนวนคน (ท่าน)</label>
        <input type="number" name="guests_count" min="1" value="2" required class="w-full p-3 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">⏰ เวลาที่ต้องการจอง</label>
        <input type="text" name="reserve_time" placeholder="เช่น 18:30 น." required class="w-full p-3 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
      </div>
    </div>

    <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-900 font-extrabold text-sm py-3.5 rounded-xl shadow-md transition duration-200 mt-2">
      ✨ ยืนยันการจองโต๊ะ
    </button>
  </form>

  <div class="mt-6 border-t pt-4 text-center">
    <a href="/tables" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 transition">
      ข้ามไปหน้าสั่งอาหารเลย ➔
    </a>
  </div>
</div>
{% endblock %}
