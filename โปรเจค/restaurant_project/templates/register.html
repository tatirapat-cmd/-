{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">📝 สมัครสมาชิก (Sign Up)</h2>
        <a href="/" class="text-xs text-slate-500 hover:text-indigo-600 font-medium">⬅️ กลับหน้าหลัก</a>
    </div>
    <form method="POST" action="/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Username</label>
            <input type="text" name="username" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <input type="password" name="password" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">บทบาทผู้ใช้งาน (Role)</label>
            <select name="role" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                <option value="customer">Customer (ลูกค้า)</option>
                <option value="staff">Staff (พนักงาน)</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-lg shadow transition">สมัครสมาชิก</button>
    </form>
    <div class="text-center mt-4 text-sm text-slate-600">
        มีบัญชีอยู่แล้ว? <a href="/login" class="text-indigo-600 font-semibold hover:underline">เข้าสู่ระบบ</a>
    </div>
</div>
{% endblock %}
