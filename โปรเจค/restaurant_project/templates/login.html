{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">🔑 เข้าสู่ระบบ</h2>
        <a href="/" class="text-xs text-slate-500 hover:text-indigo-600 font-medium">⬅️ กลับหน้าหลัก</a>
    </div>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Username</label>
            <input type="text" name="username" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <input type="password" name="password" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow transition">Sign In</button>
    </form>
    <div class="text-center mt-4 text-sm text-slate-600">
        ยังไม่มีบัญชีใช่ไหม? <a href="/register" class="text-indigo-600 font-semibold hover:underline">สมัครสมาชิกที่นี่</a>
    </div>
</div>
{% endblock %}
